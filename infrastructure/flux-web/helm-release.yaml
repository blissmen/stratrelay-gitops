apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-web
  namespace: flux-system
spec:
  interval: 10m
  releaseName: flux-web
  chartRef:
    kind: OCIRepository
    name: flux-web
    namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: flux-web
    installCRDs: true
    web:
      enabled: true
      serverOnly: true
      serverReplicas: 1
      ingress:
        enabled: false
      httpRoute:
        enabled: false
      networkPolicy:
        create: true
    service:
      type: ClusterIP
