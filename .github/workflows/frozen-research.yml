name: Frozen research images
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checkpoint-image-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_frozen_research.py
      - run: python3 -m unittest discover -s scripts -p test_frozen_research.py
      - run: python3 -m unittest discover -s scripts -p test_donchian_binding_preflight.py

      - run: python3 -m unittest discover -s scripts -p test_continuation_binding_preflight.py

