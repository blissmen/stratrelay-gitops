apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-ops-console
  namespace: trading
  labels:
    app: trading-ops-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trading-ops-console
  template:
    metadata:
      labels:
        app: trading-ops-console
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trading-ops-console
          image: ghcr.io/blissmen/trading-ops-console@sha256:464b42e99e8ad0b33082d416b68960043f385f433b10cd9ed78ab69a79e3a2db
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 18
            periodSeconds: 5
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 1Gi
          securityContext:
            capabilities:
              drop:
                - NET_RAW
