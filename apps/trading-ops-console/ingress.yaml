apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trading-ops-console-ingress-staging
  namespace: default
  labels:
    app: trading-ops-console
spec:
  ingressClassName: traefik
  rules:
    - host: console.stratrelay.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trading-ops-console-service
                port:
                  name: http
