apiVersion: v1
kind: Service
metadata:
  name: open-terminal
  namespace: openwebui
  labels:
    app.kubernetes.io/name: open-terminal
    app.kubernetes.io/part-of: open-webui
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: open-terminal
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
