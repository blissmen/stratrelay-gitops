apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: open-terminal-ingress
  namespace: openwebui
  labels:
    app.kubernetes.io/name: open-terminal
    app.kubernetes.io/part-of: open-webui
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: open-terminal
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: openwebui
      ports:
        - protocol: TCP
          port: 8000
