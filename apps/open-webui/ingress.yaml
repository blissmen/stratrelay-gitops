apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openwebui-ingress
  namespace: openwebui
  labels:
    app: openwebui
spec:
  ingressClassName: traefik
  rules:
    - host: chat.stratrelay.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openwebui
                port:
                  name: http
