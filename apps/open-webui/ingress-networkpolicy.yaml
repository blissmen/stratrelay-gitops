apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openwebui-ingress
  namespace: openwebui
  labels:
    app.kubernetes.io/name: openwebui
    app.kubernetes.io/part-of: open-webui
spec:
  podSelector:
    matchLabels:
      app: openwebui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trading
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared
      ports:
        - protocol: TCP
          port: 8080
