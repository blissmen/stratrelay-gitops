apiVersion: apps/v1
kind: Deployment
metadata:
  name: stratrelay-portal
  namespace: trading
spec:
  template:
    spec:
      volumes:
        - name: nginx-config
          configMap:
            name: stratrelay-portal-nginx
      containers:
        - name: stratrelay-portal
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
