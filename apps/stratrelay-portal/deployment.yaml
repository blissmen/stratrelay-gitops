apiVersion: apps/v1
kind: Deployment
metadata:
  name: stratrelay-portal
  namespace: trading
  labels:
    app: stratrelay-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stratrelay-portal
  template:
    metadata:
      labels:
        app: stratrelay-portal
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stratrelay-portal
          image: ghcr.io/strat-relay/portal@sha256:45282824cd5dba3ec6f299311a09829d3bf8f0c468ca9ebec15147de795cb612
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 18
            periodSeconds: 5
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 1Gi
          securityContext:
            capabilities:
              drop:
                - NET_RAW
