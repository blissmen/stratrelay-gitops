apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stratrelay-portal-ingress-policy
  namespace: trading
  labels:
    app: stratrelay-portal
spec:
  podSelector:
    matchLabels:
      app: stratrelay-portal
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared
      ports:
        - protocol: TCP
          port: 80
