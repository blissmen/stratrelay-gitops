apiVersion: v1
kind: ConfigMap
metadata:
  name: continuation-binding-preflight-20261104-r3
  namespace: trading
immutable: true
data:
  preflight.py: |
    import json
    from dataclasses import asdict
    from postgres.db import connect
    from research.strategy_library_forward import RunConfig, ForwardObserver
    cfg = RunConfig.load('/config/run.json')
    with connect(readonly=True) as conn:
      with conn.cursor() as cur:
        cur.execute("SET TRANSACTION READ ONLY")
        cur.execute("SET LOCAL statement_timeout='10s'")
        cur.execute("SELECT state FROM research.strategy_library_forward_state WHERE run_id=%s", (cfg.run_id,))
        row = cur.fetchone()
      conn.rollback()
    stored = row[0] if row else None
    saved = (stored or {}).get('manifest', {})
    enc = lambda x: json.dumps(x, sort_keys=True, separators=(',', ':'))
    report = {
      'run_id': cfg.run_id,
      'status': 'BINDING_MATCH' if stored and stored.get('binding') == ForwardObserver(cfg).binding and enc(saved.get('config')) == enc(asdict(cfg)) and saved.get('artifact') == ForwardObserver(cfg).artifact else 'BINDING_MISMATCH' if stored else 'RUN_MISSING',
      'read_only': True, 'database_writes': 0, 'broker_writes': 0,
    }
    print(json.dumps(report, sort_keys=True), flush=True)
    raise SystemExit(0 if report['status'] == 'BINDING_MATCH' else 1)
  continuation_binding_preflight.py: |
    exec(open('/recovery/preflight.py').read(), globals())
---
