# One-off, additive-only canonical schema migration. The runner applies every
# pending migration transactionally and is safe to re-run after a reconcile.
apiVersion: batch/v1
kind: Job
metadata:
  name: trading-platform-schema-migrations
  namespace: trading
  annotations:
    # Jobs have immutable pod templates. Replace the completed migration Job
    # when release promotion changes its runtime image.
    kustomize.toolkit.fluxcd.io/force: enabled
  labels:
    app.kubernetes.io/name: trading-platform-schema-migrations
    app.kubernetes.io/component: schema-migration
    app.kubernetes.io/part-of: trading-platform
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trading-platform-schema-migrations
        app.kubernetes.io/component: schema-migration
        app.kubernetes.io/part-of: trading-platform
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/strat-relay/trading-platform-runtime@sha256:e46755a01b2645353a74b813e0a956081dd1d36aa6f64b8c3cc0267c4a9f906d
          imagePullPolicy: IfNotPresent
          command: [python, -m, postgres.migrate]
          envFrom:
            - secretRef:
                name: trading-runtime-endpoints
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 256Mi
