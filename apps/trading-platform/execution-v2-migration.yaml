apiVersion: batch/v1
kind: Job
metadata:
  name: execution-v2-schema-migrations
  namespace: trading
  labels:
    app.kubernetes.io/name: execution-v2-migrations
    app.kubernetes.io/component: v2-execution
    app.kubernetes.io/part-of: trading-platform
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: execution-v2-migrations
        app.kubernetes.io/component: v2-execution
        app.kubernetes.io/part-of: trading-platform
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/strat-relay/trading-platform-runtime@sha256:eef2ca955256c23d86ce164ca819b61adcd5b596b3bf5236e814b5b6107f381a
          imagePullPolicy: IfNotPresent
          command: [python, -m, postgres.migrate]
          envFrom:
            - secretRef:
                name: trading-runtime-endpoints
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 256Mi
