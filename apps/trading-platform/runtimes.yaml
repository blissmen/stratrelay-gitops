apiVersion: apps/v1
kind: Deployment
metadata:
  name: trade-management-runtime
  namespace: trading
  labels:
    app.kubernetes.io/name: trade-management-runtime
    app.kubernetes.io/component: p4-managed-trade
    app.kubernetes.io/part-of: trading-platform
spec:
  replicas: 1
  # The runtime owns a single durable JetStream consumer; overlapping old/new
  # pods cause NATS to reject the new subscription as already bound.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: trade-management-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trade-management-runtime
        app.kubernetes.io/component: p4-managed-trade
        app.kubernetes.io/part-of: trading-platform
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime
          image: ghcr.io/strat-relay/trading-platform-runtime@sha256:dd445f1e8105e813ddfeeea7d8ca51891398ff62070f0803873bce2f1dd27998
          imagePullPolicy: IfNotPresent
          command: [python, -m, trade_management.runtime]
          envFrom:
            - secretRef:
                name: trading-runtime-endpoints
          env:
            - name: P4_OBSERVATION_INTERVAL_SECONDS
              value: "30"
            - name: P4_BRIDGE_MCP_URL
              value: http://192.168.1.166:22347/mcp
            - name: P4_HEALTH_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: trade-management-runtime
  namespace: trading
  labels:
    app.kubernetes.io/name: trade-management-runtime
    app.kubernetes.io/part-of: trading-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: trade-management-runtime
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-outbox-relay
  namespace: trading
  labels:
    app.kubernetes.io/name: signal-outbox-relay
    app.kubernetes.io/component: outbox-relay
    app.kubernetes.io/part-of: trading-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: signal-outbox-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signal-outbox-relay
        app.kubernetes.io/component: outbox-relay
        app.kubernetes.io/part-of: trading-platform
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: ghcr.io/strat-relay/trading-platform-runtime@sha256:dd445f1e8105e813ddfeeea7d8ca51891398ff62070f0803873bce2f1dd27998
          imagePullPolicy: IfNotPresent
          command: [python, -m, scripts.signal_outbox_relay]
          envFrom:
            - secretRef:
                name: trading-runtime-endpoints
            - configMapRef:
                name: trading-db-primary-prepared
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 75m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
