# Scheduling transport only; preserve existing authority, strategy identities and execution settings.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: liquidity-live-runtime
  namespace: trading
spec:
  template:
    spec:
      containers:
      - name: runtime
        env:
        - name: STRATEGY_EVENT_MODE
          value: JETSTREAM
        - name: STRATEGY_EVENT_RUNTIME_ID
          value: liquidity-live-runtime
        - name: STRATEGY_EVENT_RECONCILE_SECONDS
          value: '30'
        - name: NATS_URL
          value: nats://trading-nats.trading.svc.cluster.local:4222
        - name: P2_NATS_USER
          valueFrom:
            secretKeyRef:
              name: trading-nats-auth
              key: NATS_USER
        - name: P2_NATS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: trading-nats-auth
              key: NATS_PASSWORD
