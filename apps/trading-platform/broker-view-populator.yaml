# Broker-view populator (strat-relay/platform-tools broker_view/): every 15 s it reads each
# allow-listed read-only broker tool once from the read bridge (22347) - account, positions,
# orders, history, symbols - and stores it in trading-redis. The API's /broker/* endpoints and the
# Trade Manager live projection serve that view (BROKER_VIEW_REDIS_URL in platform-api.yaml).
# Read-only: no broker writes, no DB access.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker-view-populator
  namespace: trading
  labels:
    app.kubernetes.io/name: broker-view-populator
    app.kubernetes.io/component: broker-view
    app.kubernetes.io/part-of: trading-platform
spec:
  replicas: 1
  strategy:
    type: Recreate   # one writer at a time
  selector:
    matchLabels:
      app.kubernetes.io/name: broker-view-populator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: broker-view-populator
        app.kubernetes.io/component: broker-view
        app.kubernetes.io/part-of: trading-platform
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: populator
          image: ghcr.io/strat-relay/trading-platform-runtime@sha256:b23669b664f1cd7c6b6369b45865a52818205a28c5b030340fed7edf67ec08e1
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "broker_view.service"]
          env:
            - name: BROKER_VIEW_BRIDGE_URL
              value: http://10.10.10.100:22347/mcp
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-redis-auth
                  key: password
            - name: BROKER_VIEW_REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@trading-redis.trading.svc:6379/0
            - name: BROKER_VIEW_REFRESH_SECONDS
              value: "15"
            - name: BROKER_VIEW_BRIDGE_TIMEOUT_SECONDS
              value: "10"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: broker-view-populator-egress
  namespace: trading
  labels:
    app.kubernetes.io/part-of: trading-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: broker-view-populator
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - ipBlock:
            cidr: 10.10.10.100/32
      ports:
        - {port: 22347, protocol: TCP}
