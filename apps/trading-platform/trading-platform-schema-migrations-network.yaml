apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trading-platform-schema-migrations-egress
  namespace: trading
  labels:
    app.kubernetes.io/part-of: trading-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trading-platform-schema-migrations
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trading
          podSelector:
            matchLabels:
              app.kubernetes.io/name: trading-postgres
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trading-platform-schema-migrations-postgres-ingress
  namespace: trading
  labels:
    app.kubernetes.io/part-of: trading-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trading-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: trading-platform-schema-migrations
      ports:
        - port: 5432
          protocol: TCP
