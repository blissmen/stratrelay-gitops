apiVersion: apps/v1
kind: Deployment
metadata:
  name: liquidity-live-runtime
  namespace: trading
  labels:
    app.kubernetes.io/name: liquidity-live-runtime
    app.kubernetes.io/component: strategy-runner
    app.kubernetes.io/part-of: trading-platform
spec:
  replicas: 1
  strategy:
    # The evaluator restores state from PostgreSQL and owns one durable runtime
    # identity; avoid overlapping evaluators during a release.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: liquidity-live-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: liquidity-live-runtime
        app.kubernetes.io/component: strategy-runner
        app.kubernetes.io/part-of: trading-platform
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime
          image: ghcr.io/strat-relay/trading-platform-runtime@sha256:37c6b84e9e3e09dc1c6bd63a4d736e6c24578ca62277341697b11e0742ab4aa3
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              export SIGNAL_CUTOFF_ID="$(python -c 'import json,os; print(json.loads(os.environ["CUTOFF_RECORD_JSON"])["cutoff_id"])')";
              export SIGNAL_CUTOFF_UTC="$(python -c 'import json,os; print(json.loads(os.environ["CUTOFF_RECORD_JSON"])["cutoff_utc"])')";
              exec python liquidity_live_service.py
          envFrom:
            - secretRef:
                name: trading-runtime-endpoints
            - configMapRef:
                name: trading-db-primary-prepared
            - secretRef:
                name: trading-signal-cutoff
          env:
            - name: LIQUIDITY_LIVE_RUNTIME_ENABLED
              value: "true"
            - name: LIQUIDITY_LIVE_MCP_URL
              value: http://192.168.1.166:22347/mcp
            - name: LIQUIDITY_LIVE_POLL_SECONDS
              value: "5"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 75m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 512Mi
