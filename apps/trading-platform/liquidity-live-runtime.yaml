apiVersion: apps/v1
kind: Deployment
metadata:
  name: liquidity-live-runtime
  namespace: trading
  labels:
    app.kubernetes.io/name: liquidity-live-runtime
    app.kubernetes.io/component: strategy-runner
    app.kubernetes.io/part-of: trading-platform
spec:
  replicas: 1
  strategy:
    # The evaluator restores state from PostgreSQL and owns one durable runtime
    # identity; avoid overlapping evaluators during a release.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: liquidity-live-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: liquidity-live-runtime
        app.kubernetes.io/component: strategy-runner
        app.kubernetes.io/part-of: trading-platform
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime
          image: ghcr.io/strat-relay/trading-platform-runtime@sha256:f7b4ea91af4e5c6866bdceaa0e1f10ade9c340d7e070ea110c65fa11865ee872
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              export SIGNAL_CUTOFF_ID="$(python -c 'import json,os; print(json.loads(os.environ["CUTOFF_RECORD_JSON"])["cutoff_id"])')";
              export SIGNAL_CUTOFF_UTC="$(python -c 'import json,os; print(json.loads(os.environ["CUTOFF_RECORD_JSON"])["cutoff_utc"])')";
              exec python liquidity_live_service.py
          envFrom:
            - secretRef:
                name: trading-runtime-endpoints
            - configMapRef:
                name: trading-db-primary-prepared
            - secretRef:
                name: trading-signal-cutoff
          env:
            - name: LIQUIDITY_LIVE_RUNTIME_ENABLED
              value: "true"
            # Phase D1: retain OPEN-outcome monitoring without canonical
            # signal publication. The source release contains the explicit
            # runtime-mode implementation.
            - name: LIQUIDITY_LIVE_RUNTIME_MODE
              value: "MONITOR_ONLY"
            - name: LIQUIDITY_LIVE_ORCHESTRATOR_MODE
              value: "false"
            # Phase C: migrations 051-053 are applied; enforce DB-backed
            # legacy writer authority while standalone publication remains on.
            - name: OUTCOME_RESOLVER_ENFORCE_WRITER_GATE
              value: "true"
            # Compatibility for the currently deployed image; Redis mode does not call this URL.
            - name: LIQUIDITY_LIVE_MCP_URL
              value: http://10.10.10.100:22347/mcp
            - name: LIQUIDITY_LIVE_POLL_SECONDS
              value: "5"
            - name: MARKET_DATA_SOURCE
              value: REDIS
            - name: MARKET_DATA_MAX_AGE_SECONDS
              value: "330"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-redis-auth
                  key: password
            - name: MARKET_DATA_REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@trading-redis.trading.svc:6379/0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 75m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 512Mi
