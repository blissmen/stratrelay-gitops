apiVersion: v1
kind: ServiceAccount
metadata:
  name: library-event-cutover-reader
  namespace: trading
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: library-event-cutover-reader
  namespace: trading
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [strategy-library-canary-v1-observer, mt5-native-bridge-main-runtime, market-data-collector]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: library-event-cutover-reader
  namespace: trading
subjects:
  - kind: ServiceAccount
    name: library-event-cutover-reader
    namespace: trading
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: library-event-cutover-reader
