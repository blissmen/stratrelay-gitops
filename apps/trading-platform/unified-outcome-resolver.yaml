apiVersion: apps/v1
kind: Deployment
metadata:
  name: unified-outcome-resolver
  namespace: trading
  labels:
    app.kubernetes.io/name: unified-outcome-resolver
    app.kubernetes.io/component: outcome-resolver
    app.kubernetes.io/part-of: trading-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: unified-outcome-resolver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unified-outcome-resolver
        app.kubernetes.io/component: outcome-resolver
        app.kubernetes.io/part-of: trading-platform
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: resolver
          image: ghcr.io/strat-relay/trading-platform-runtime@sha256:00f17fc7022c3c6a79b7e3cf7ea647c9f7f5d4166cb0dc7268a1a3567288158f
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              exec python -m scripts.outcome_resolver_service --interval 5 --limit 100
          envFrom:
            - secretRef:
                name: trading-runtime-endpoints
          env:
            - name: OUTCOME_RESOLVER_ENABLED
              value: "true"
            - name: OUTCOME_RESOLVER_PRIMARY
              value: "true"
            - name: OUTCOME_RESOLVER_ENFORCE_WRITER_GATE
              value: "true"
            - name: OUTCOME_RESOLVER_HOLDER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MARKET_DATA_SOURCE
              value: REDIS
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-redis-auth
                  key: password
            - name: MARKET_DATA_REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@trading-redis.trading.svc:6379/0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
          readinessProbe:
            exec:
              command: [python, -c, "import outcome_resolver, outcome_resolver_runtime"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: [python, -c, "import outcome_resolver, outcome_resolver_runtime"]
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
