apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-v2-runtime
  namespace: trading
  labels:
    app.kubernetes.io/name: execution-v2-runtime
    app.kubernetes.io/component: v2-execution
    app.kubernetes.io/part-of: trading-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: execution-v2-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: execution-v2-runtime
        app.kubernetes.io/component: v2-execution
        app.kubernetes.io/part-of: trading-platform
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime
          image: ghcr.io/strat-relay/trading-platform-runtime@sha256:91a1611e05311ae462a63e2cf0a70d61bad6d41b251696432d5f71e5a1a83ada
          imagePullPolicy: IfNotPresent
          command: [python, -m, execution_v2.runtime]
          envFrom:
            - secretRef:
                name: trading-runtime-endpoints
            - secretRef:
                name: execution-v2-fence-signing-key
          env:
            - {name: EXECUTION_AUTHORITY_MODE, value: "DISABLED"}
            - {name: V2_EXECUTION_ACCOUNT_ID, value: "188428665"}
            - {name: V2_EXECUTION_BRIDGE_MODE, value: "real"}
            - {name: V2_BRIDGE_FENCE_URL, value: "http://10.10.10.100:22348/mcp"}
            - {name: V2_BROKER_SYMBOL_MAP_JSON, value: '{"real:188428665":{"XAUUSD":"XAUUSDm","BTCUSD":"BTCUSDm","EURUSD":"EURUSDm","USDJPY":"USDJPYm"}}'}
            - {name: V2_READ_BRIDGE_URL, value: "http://10.10.10.100:22347/mcp"}
            - {name: RISK_CONTEXT_SOURCE, value: "REDIS"}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-redis-auth
                  key: password
            - {name: RISK_REDIS_URL, value: "redis://:$(REDIS_PASSWORD)@trading-redis.trading.svc:6379/0"}
            # Size each trade from the account's free margin (risk_per_trade x free margin), so
            # every open trade leaves less for the next (strat-relay/platform-tools#59).
            - {name: V2_RISK_SIZING_BASIS, value: "FREE_MARGIN"}
            - {name: V2_EXECUTION_RISK_POLICY_PATH, value: "/app/orchestration/config/v2_execution_risk_policy.json"}
            - {name: V2_EXECUTION_HEALTH_PORT, value: "8082"}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: execution-v2-runtime
  namespace: trading
  labels:
    app.kubernetes.io/name: execution-v2-runtime
    app.kubernetes.io/part-of: trading-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: execution-v2-runtime
  ports:
    - name: http
      port: 8082
      targetPort: http
      protocol: TCP
