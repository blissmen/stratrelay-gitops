apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-v2-runtime
  namespace: trading
  labels:
    app.kubernetes.io/name: execution-v2-runtime
    app.kubernetes.io/component: v2-execution
    app.kubernetes.io/part-of: trading-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: execution-v2-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: execution-v2-runtime
        app.kubernetes.io/component: v2-execution
        app.kubernetes.io/part-of: trading-platform
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/strat-relay/trading-platform-runtime@sha256:eef2ca955256c23d86ce164ca819b61adcd5b596b3bf5236e814b5b6107f381a
          imagePullPolicy: IfNotPresent
          command: [python, -m, postgres.migrate]
          envFrom:
            - secretRef:
                name: trading-runtime-endpoints
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 256Mi
      containers:
        - name: runtime
          image: ghcr.io/strat-relay/trading-platform-runtime@sha256:eef2ca955256c23d86ce164ca819b61adcd5b596b3bf5236e814b5b6107f381a
          imagePullPolicy: IfNotPresent
          command: [python, -m, execution_v2.runtime]
          envFrom:
            - secretRef:
                name: trading-runtime-endpoints
            - secretRef:
                name: execution-v2-fence-signing-key
          env:
            - {name: EXECUTION_AUTHORITY_MODE, value: "DISABLED"}
            - {name: V2_EXECUTION_ACCOUNT_ID, value: "188428665"}
            - {name: V2_EXECUTION_BRIDGE_MODE, value: "real"}
            - {name: V2_BRIDGE_FENCE_URL, value: "http://192.168.1.166:22348/mcp"}
            - {name: V2_BROKER_SYMBOL_MAP_JSON, value: '{"real:188428665":{"XAUUSD":"XAUUSDm","BTCUSD":"BTCUSDm","EURUSD":"EURUSDm","USDJPY":"USDJPYm"}}'}
            - {name: V2_READ_BRIDGE_URL, value: "http://192.168.1.166:22347/mcp"}
            - {name: V2_EXECUTION_RISK_POLICY_PATH, value: "/app/orchestration/config/v2_execution_risk_policy.json"}
            - {name: V2_EXECUTION_HEALTH_PORT, value: "8082"}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: execution-v2-runtime
  namespace: trading
  labels:
    app.kubernetes.io/name: execution-v2-runtime
    app.kubernetes.io/part-of: trading-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: execution-v2-runtime
  ports:
    - name: http
      port: 8082
      targetPort: http
      protocol: TCP
