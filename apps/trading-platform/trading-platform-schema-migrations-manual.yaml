# Operator-controlled only. This manifest is intentionally excluded from the
# production Kustomization. Do not add it to apps/trading-platform/kustomization.yaml.
apiVersion: batch/v1
kind: Job
metadata:
  name: trading-platform-schema-migrations-051-053
  namespace: trading
  labels:
    app.kubernetes.io/name: trading-platform-schema-migrations
    app.kubernetes.io/component: schema-migration
    app.kubernetes.io/part-of: trading-platform
spec:
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trading-platform-schema-migrations
        app.kubernetes.io/component: schema-migration
        app.kubernetes.io/part-of: trading-platform
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/strat-relay/trading-platform-runtime@sha256:f7b4ea91af4e5c6866bdceaa0e1f10ade9c340d7e070ea110c65fa11865ee872
          imagePullPolicy: IfNotPresent
          command: [python, -m, postgres.migrate]
          envFrom:
            - secretRef:
                name: trading-runtime-endpoints
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
