apiVersion: apps/v1
kind: Deployment
metadata:
  name: price-action-sr-retest-v1-observer
  namespace: trading
  labels: {app.kubernetes.io/name: price-action-sr-retest-v1-observer, app.kubernetes.io/component: research-observer, app.kubernetes.io/part-of: trading-platform, stratrelay.app/status: research}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: price-action-sr-retest-v1-observer}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: price-action-sr-retest-v1-observer, app.kubernetes.io/component: research-observer, app.kubernetes.io/part-of: trading-platform, stratrelay.app/status: research}
    spec:
      imagePullSecrets: [{name: ghcr-pull}]
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: observer
          image: ghcr.io/strat-relay/trading-platform-runtime@sha256:36253679c71e3a32e6bd0d5242b4fabec7e37197f8c35ee97c295fff0051ca42
          imagePullPolicy: IfNotPresent
          command: [python, -m, research.price_action_forward_runtime, run]
          envFrom:
            - secretRef: {name: trading-runtime-endpoints}
            - configMapRef: {name: trading-db-primary-prepared}
          env:
            - {name: PRICE_ACTION_INSTANCE_ID, value: 7f1d6e5a-5ab3-4b59-8d2f-0c6f9e3d0104}
            - {name: PRICE_ACTION_STRATEGY, value: sr_retest}
            - {name: PRICE_ACTION_MCP_URL, value: http://10.10.10.100:22347/mcp}
            - {name: PRICE_ACTION_POLL_SECONDS, value: "60"}
            - name: PRICE_ACTION_SYMBOL_MAP
              value: '{"EURUSD":"EURUSDm","GBPUSD":"GBPUSDm","USDJPY":"USDJPYm","USDCHF":"USDCHFm","USDCAD":"USDCADm","AUDUSD":"AUDUSDm","NZDUSD":"NZDUSDm","EURJPY":"EURJPYm","GBPJPY":"GBPJPYm","EURGBP":"EURGBPm","AUDJPY":"AUDJPYm","CADJPY":"CADJPYm","CHFJPY":"CHFJPYm","GBPAUD":"GBPAUDm","GBPCAD":"GBPCADm"}'
            - {name: EXECUTION_AUTHORITY_MODE, value: DISABLED}
            - {name: SIGNAL_AUTHORITY_MODE, value: RESEARCH_ONLY}
            - {name: ORCHESTRATOR_MODE, value: "false"}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 768Mi}
          readinessProbe: {exec: {command: [python, -m, research.price_action_forward_runtime, health]}, initialDelaySeconds: 10, periodSeconds: 30, timeoutSeconds: 10}
          livenessProbe: {exec: {command: [python, -m, research.price_action_forward_runtime, health]}, initialDelaySeconds: 30, periodSeconds: 60, timeoutSeconds: 10}
      volumes: [{name: tmp, emptyDir: {}}]
---
