apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-signals-api
  namespace: trading
  labels:
    app.kubernetes.io/name: platform-signals-api
    app.kubernetes.io/part-of: trading-platform
    app.kubernetes.io/component: platform-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-signals-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-signals-api
        app.kubernetes.io/part-of: trading-platform
        app.kubernetes.io/component: platform-api
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/strat-relay/trading-platform-control-api@sha256:6a6a2017c0b7e07dffe3bed918b00f0699531b4ce0b9cd2a8302734a19d490ec
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 22350
              protocol: TCP
          env:
            - name: TRADING_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: trading-runtime-endpoints
                  key: TRADING_POSTGRES_DSN
            - name: ORCHESTRATOR_MODE
              valueFrom:
                configMapKeyRef:
                  name: trading-db-primary-prepared
                  key: ORCHESTRATOR_MODE
            - name: SIGNAL_AUTHORITY_MODE
              valueFrom:
                configMapKeyRef:
                  name: trading-db-primary-prepared
                  key: SIGNAL_AUTHORITY_MODE
            - name: EXECUTION_AUTHORITY_MODE
              valueFrom:
                configMapKeyRef:
                  name: trading-db-primary-prepared
                  key: EXECUTION_AUTHORITY_MODE
            - name: V2_EXECUTION_BRIDGE_MODE
              value: "real"
            - name: SIGNAL_DB_PRIMARY_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: trading-db-primary-prepared
                  key: SIGNAL_DB_PRIMARY_ENABLED
            - name: PLATFORM_STRATEGY_CONFIG_PATH
              value: /etc/platform-config/platform.json
          volumeMounts:
            - name: platform-config
              mountPath: /etc/platform-config
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: platform-config
          configMap:
            name: mt5-native-bridge-safe-platform-config
            items:
              - key: platform.json
                path: platform.json
---
apiVersion: v1
kind: Service
metadata:
  name: platform-signals-api
  namespace: trading
  labels:
    app.kubernetes.io/name: platform-signals-api
    app.kubernetes.io/part-of: trading-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: platform-signals-api
  ports:
    - name: http
      port: 22350
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: platform-control-api
  namespace: trading
  labels:
    app.kubernetes.io/name: platform-control-api
    app.kubernetes.io/part-of: trading-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: platform-signals-api
  ports:
    - name: http
      port: 22350
      targetPort: http
      protocol: TCP
