# Frozen research observation canary. T0: 2026-10-16T18:15:00Z.
# Roll back by scaling to zero; preserve manifest, state and outcome evidence.
apiVersion: v1
kind: ConfigMap
immutable: true
metadata:
  name: strategy-library-canary-v1-manifest
  namespace: trading
data:
  run.json: |
    {
      "schema": "library-forward-observation.v1",
      "execution_eligible": false,
      "run_id": "library-canary-20261016-v1",
      "activation_time": 1792174500,
      "keys": [
        "donchian_breakout",
        "ema_pullback",
        "fvg_retracement"
      ],
      "symbols": {
        "XAUUSD": "XAUUSDm",
        "BTCUSD": "BTCUSDm",
        "USDJPY": "USDJPYm"
      },
      "history": 320,
      "max_age_seconds": 330,
      "prospective_max_delay": 120,
      "max_retained_bars": 10000
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: strategy-library-canary-v1-observer
  namespace: trading
  labels: {app.kubernetes.io/name: strategy-library-canary-v1-observer, app.kubernetes.io/component: research-observer, stratrelay.app/status: research}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: strategy-library-canary-v1-observer}
  template:
    metadata:
      labels: {app.kubernetes.io/name: strategy-library-canary-v1-observer, app.kubernetes.io/component: research-observer, stratrelay.app/status: research}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: ghcr-pull}]
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: verify-no-event-cutover
          image: "ghcr.io/strat-relay/trading-platform-runtime@sha256:beaf80a9a1d01fc17633bf55588c37b120ade5dd79e64dbfc8d4b83f81feb5bd"
          command:
            - python
            - -c
            - |
              import json
              from postgres.db import connect
              with connect() as conn:
                  with conn.cursor() as cur:
                      cur.execute("SELECT EXISTS (SELECT 1 FROM research.strategy_library_forward_state WHERE run_id=%s OR (state->'activation_attestation'->>'transport'='JETSTREAM' AND state->'config'->'keys' ?| ARRAY['donchian_breakout','ema_pullback','fvg_retracement']))", ('library-js-20261022-0600-v1',))
                      blocked = cur.fetchone()[0]
                  conn.rollback()
              print(json.dumps({'status':'BLOCKED_EVENT_RUN_EXISTS' if blocked else 'ORIGINAL_RUN_RECOVERY_ALLOWED','broker_writes':0}))
              raise SystemExit(1 if blocked else 0)
          envFrom:
            - secretRef: {name: strategy-library-observer-db}
          env:
            - {name: PYTHONPATH, value: /app}
            - {name: PGCONNECT_TIMEOUT, value: '10'}
            - {name: PGOPTIONS, value: '-c default_transaction_read_only=on -c statement_timeout=10000'}
            - {name: EXECUTION_AUTHORITY_MODE, value: DISABLED}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 100m, memory: 128Mi}
      containers:
        - name: observer
          # Quoted pin is deliberately outside bulk release repinning: frozen experiment artifact.
          image: "ghcr.io/strat-relay/trading-platform-runtime@sha256:beaf80a9a1d01fc17633bf55588c37b120ade5dd79e64dbfc8d4b83f81feb5bd"
          command: [python, -m, research.strategy_library_forward, run, --manifest, /config/run.json, --interval, "60"]
          envFrom:
            - secretRef: {name: strategy-library-observer-db}
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: trading-redis-auth, key: password}}
            - {name: MARKET_DATA_REDIS_URL, value: "redis://:$(REDIS_PASSWORD)@trading-redis.trading.svc:6379/0"}
            - {name: PGCONNECT_TIMEOUT, value: "10"}
            - {name: EXECUTION_AUTHORITY_MODE, value: DISABLED}
            - {name: SIGNAL_AUTHORITY_MODE, value: RESEARCH_ONLY}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 768Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: manifest, mountPath: /config, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          readinessProbe:
            exec:
              command: [python, -m, research.strategy_library_forward, health, --manifest, /config/run.json]
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          startupProbe:
            exec:
              command: [python, -c, "import time; from postgres.db import connect; from research.strategy_library_forward import RunConfig; c=RunConfig.load('/config/run.json'); conn=connect(); cur=conn.cursor(); cur.execute(\"SELECT (state->'health'->>'observed_at')::double precision FROM research.strategy_library_forward_state WHERE run_id=%s\",(c.run_id,)); r=cur.fetchone(); conn.rollback(); conn.close(); raise SystemExit(0 if r and 0<=time.time()-r[0]<=900 else 1)"]
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 40
          livenessProbe:
            exec:
              command: [python, -c, "import time; from postgres.db import connect; from research.strategy_library_forward import RunConfig; c=RunConfig.load('/config/run.json'); conn=connect(); cur=conn.cursor(); cur.execute(\"SELECT (state->'health'->>'observed_at')::double precision FROM research.strategy_library_forward_state WHERE run_id=%s\",(c.run_id,)); r=cur.fetchone(); conn.rollback(); conn.close(); raise SystemExit(0 if r and 0<=time.time()-r[0]<=900 else 1)"]
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
      volumes:
        - name: manifest
          configMap: {name: strategy-library-canary-v1-manifest}
        - name: tmp
          emptyDir: {}
# stratrelay-release: frozen
