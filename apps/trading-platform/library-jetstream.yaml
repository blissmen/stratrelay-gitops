apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-event-relay
  namespace: trading
  labels: &id001
    app.kubernetes.io/name: library-event-relay
    stratrelay.app/library-events: 'true'
    stratrelay.app/status: research
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: library-event-relay
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: relay
        image: ghcr.io/strat-relay/trading-platform-runtime@sha256:35fc80be3dcb9a5062c43514395cce6772b3f004a95583d5a19fc9073f9da5fa
        command:
        - python
        - -m
        - research.library_event_service
        - relay
        envFrom:
        - secretRef:
            name: library-event-relay
        env:
        - name: LIBRARY_EVENT_TRANSPORT
          value: JETSTREAM
        - name: LIBRARY_EVENT_DATABASE
          value: trading_platform
        - name: EXECUTION_AUTHORITY_MODE
          value: DISABLED
        - name: PGCONNECT_TIMEOUT
          value: '10'
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: PYTHONPATH
          value: /app
        - name: SIGNAL_AUTHORITY_MODE
          value: DB_PRIMARY
        - name: SIGNAL_DB_PRIMARY_ENABLED
          value: 'true'
        - name: SIGNAL_JETSTREAM_PRIMARY_ENABLED
          value: 'true'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 768Mi
        volumeMounts:
