apiVersion: apps/v1
kind: Deployment
metadata:
  name: mt5-native-bridge-main-runtime
  namespace: trading
  labels:
    app.kubernetes.io/name: mt5-native-bridge
    app.kubernetes.io/component: main-runtime
    app.kubernetes.io/part-of: trading-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mt5-native-bridge
      app.kubernetes.io/component: main-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mt5-native-bridge
        app.kubernetes.io/component: main-runtime
        app.kubernetes.io/part-of: trading-platform
    spec:
      automountServiceAccountToken: false
      # orchestrator-shadow pulls the private ghcr.io trading-platform-runtime image (same as the
      # other platform runtimes); without this the Recreate rollout fails with ImagePullBackOff.
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orchestrator-shadow
          image: ghcr.io/strat-relay/trading-platform-runtime@sha256:0268b7f06c3bf787ec6aeb7b646ed0f1436a955d2901c59896d4ac537337eb9a
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              trap 'exit 143' TERM INT;
              while true; do
                rm -f /work/runtime/orchestration/pid;
                python3 signal_orchestrator.py primary-start --interval 15;
                rc=$?;
                echo "signal orchestrator exited rc=$rc; retrying in 5s" >&2;
                sleep 5;
              done
          # Code comes from the release image; runtime state stays on the volume. Configuration comes
          # from PostgreSQL (platform-tools #32), so no platform.json is mounted.
          workingDir: /app
          env:
            - name: TRADING_PLATFORM_RUNTIME_DIR
              value: /work/runtime
            - name: CONTEXT_RUNNER_STATE_DIR
              value: /work
            - name: CONTEXT_V2_RUNNER_STATE_DIR
              value: /work/context-v2
            - name: MARKET_DATA_SOURCE
              value: REDIS
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-redis-auth
                  key: password
            - name: MARKET_DATA_REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@trading-redis.trading.svc:6379/0
          envFrom:
            - secretRef:
                name: trading-runtime-endpoints
            - configMapRef:
                name: trading-db-primary-prepared
            - secretRef:
                name: trading-signal-cutoff
          volumeMounts:
            - name: runtime
              mountPath: /work
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 350m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop: [ALL]
        - name: context-paper
          image: ghcr.io/strat-relay/trading-platform-runtime@sha256:0268b7f06c3bf787ec6aeb7b646ed0f1436a955d2901c59896d4ac537337eb9a
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              rm -f /work/context_structure_retrace_forward.pid &&
              exec python context_structure_retrace_forward.py start --interval 15
              --symbols XAUUSDm BTCUSDm USDJPYm EURUSDm
          env:
            - name: TRADING_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: trading-runtime-endpoints
                  key: TRADING_POSTGRES_DSN
            - name: ENTRY_OUTCOME_SIGNAL_CUTOFF_ID
              value: 931fe86e-c634-422b-89c1-cc65fd572d2c
            # Runner code from the release image; state, ledger, heartbeat and frozen manifest on the volume.
            - name: CONTEXT_RUNNER_STATE_DIR
              value: /work
            - name: MARKET_DATA_SOURCE
              value: REDIS
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-redis-auth
                  key: password
            - name: MARKET_DATA_REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@trading-redis.trading.svc:6379/0
          workingDir: /app
          volumeMounts:
            - name: runtime
              mountPath: /work
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop: [ALL]
        - name: context-v2-research
          # V2 is an independent research-only evaluator. It must not share V1's
          # state, manifest, lock, or ledger even though both runners use the same
          # runtime PVC and read-only market-data path.
          image: ghcr.io/strat-relay/trading-platform-runtime@sha256:0268b7f06c3bf787ec6aeb7b646ed0f1436a955d2901c59896d4ac537337eb9a
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              rm -f /work/context-v2/context_structure_retrace_v2_forward.pid &&
              exec python context_structure_retrace_v2_forward.py start --interval 15
              --mcp-url http://192.168.1.166:22347/mcp
              --symbols XAUUSDm BTCUSDm USDJPYm EURUSDm
          env:
            - name: CONTEXT_V2_INSTANCE_ID
              value: context-v2-research
            - name: CONTEXT_V2_RUNNER_STATE_DIR
              value: /work/context-v2
            - name: TRADING_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: trading-runtime-endpoints
                  key: TRADING_POSTGRES_DSN
            - name: ENTRY_OUTCOME_SIGNAL_CUTOFF_ID
              value: 931fe86e-c634-422b-89c1-cc65fd572d2c
            - name: MARKET_DATA_SOURCE
              value: REDIS
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-redis-auth
                  key: password
            - name: MARKET_DATA_REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@trading-redis.trading.svc:6379/0
          workingDir: /app
          volumeMounts:
            - name: runtime
              mountPath: /work
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop: [ALL]
        - name: context-post-exit-observer
          # Research-only observer. It shares the Context state PVC but has no bridge,
          # PostgreSQL, execution, or broker credentials.
          image: ghcr.io/strat-relay/trading-platform-runtime@sha256:0268b7f06c3bf787ec6aeb7b646ed0f1436a955d2901c59896d4ac537337eb9a
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - research.context_structure_retrace_post_exit_ledger
            - watch
            - --interval
            - "60"
          env:
            - name: CONTEXT_RUNNER_STATE_DIR
              value: /work
            - name: CONTEXT_POST_EXIT_LEDGER_DIR
              value: /work
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-redis-auth
                  key: password
            - name: MARKET_DATA_REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@trading-redis.trading.svc:6379/0
          workingDir: /app
          volumeMounts:
            - name: runtime
              mountPath: /work
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop: [ALL]
      volumes:
        - name: runtime
          persistentVolumeClaim:
            claimName: mt5-native-bridge-runtime
