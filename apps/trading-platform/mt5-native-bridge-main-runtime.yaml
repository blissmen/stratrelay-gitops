apiVersion: apps/v1
kind: Deployment
metadata:
  name: mt5-native-bridge-main-runtime
  namespace: trading
  labels:
    app.kubernetes.io/name: mt5-native-bridge
    app.kubernetes.io/component: main-runtime
    app.kubernetes.io/part-of: trading-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mt5-native-bridge
      app.kubernetes.io/component: main-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mt5-native-bridge
        app.kubernetes.io/component: main-runtime
        app.kubernetes.io/part-of: trading-platform
    spec:
      automountServiceAccountToken: false
      # orchestrator-shadow pulls the private ghcr.io trading-platform-runtime image (same as the
      # other platform runtimes); without this the Recreate rollout fails with ImagePullBackOff.
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # One-shot historical reconciliation of orphaned OPEN positions (platform-tools #33): replays
        # the M5 bars the old runner skipped, through the runner's own exit rule, while the runner is
        # stopped. Read-only bridge; writes only the runner's state + ledger; the marker makes it a
        # no-op on every later start.
        - name: reconcile-context-orphans
          image: ghcr.io/strat-relay/trading-platform-runtime@sha256:169e8646a0486c470a47c2f8dd4839ba9912109a4bacbc46155ee7ccd79a6bd7
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command:
            - python
            - -m
            - scripts.reconcile_context_orphans
            - --mcp-url
            - http://192.168.1.166:22347/mcp
            - --apply
            - --once-marker
            - /work/.context_orphan_reconciliation_done
          env:
            - name: CONTEXT_RUNNER_STATE_DIR
              value: /work
          volumeMounts:
            - name: runtime
              mountPath: /work
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop: [ALL]
      containers:
        - name: orchestrator-shadow
          image: ghcr.io/strat-relay/trading-platform-runtime@sha256:d34dcc39d5d82d7cc06bebe17e0419c051d01753582143e96c2fdc0151414b42
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - rm -f /work/runtime/orchestration/pid && exec python3 signal_orchestrator.py primary-start --interval 15
          # Code comes from the release image; runtime state stays on the volume. Configuration comes
          # from PostgreSQL (platform-tools #32), so no platform.json is mounted.
          workingDir: /app
          env:
            - name: TRADING_PLATFORM_RUNTIME_DIR
              value: /work/runtime
            - name: CONTEXT_RUNNER_STATE_DIR
              value: /work
          envFrom:
            - secretRef:
                name: trading-runtime-endpoints
            - configMapRef:
                name: trading-db-primary-prepared
            - secretRef:
                name: trading-signal-cutoff
          volumeMounts:
            - name: runtime
              mountPath: /work
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 350m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop: [ALL]
        - name: context-paper
          image: ghcr.io/strat-relay/trading-platform-runtime@sha256:169e8646a0486c470a47c2f8dd4839ba9912109a4bacbc46155ee7ccd79a6bd7
          imagePullPolicy: IfNotPresent
          command:
            - python
            - context_structure_retrace_forward.py
            - start
            - --interval
            - "15"
            - --mcp-url
            - http://192.168.1.166:22347/mcp
            - --symbols
            - XAUUSDm
            - BTCUSDm
            - USDJPYm
            - EURUSDm
          env:
            - name: TRADING_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: trading-runtime-endpoints
                  key: TRADING_POSTGRES_DSN
            - name: ENTRY_OUTCOME_SIGNAL_CUTOFF_ID
              value: 931fe86e-c634-422b-89c1-cc65fd572d2c
            # Runner code from the release image; state, ledger, heartbeat and frozen manifest on the volume.
            - name: CONTEXT_RUNNER_STATE_DIR
              value: /work
          workingDir: /app
          volumeMounts:
            - name: runtime
              mountPath: /work
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop: [ALL]
      volumes:
        - name: runtime
          persistentVolumeClaim:
            claimName: mt5-native-bridge-runtime
