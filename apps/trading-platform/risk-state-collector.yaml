apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-state-collector
  namespace: trading
  labels:
    app.kubernetes.io/name: risk-state-collector
    app.kubernetes.io/component: v2-risk-state
    app.kubernetes.io/part-of: trading-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: risk-state-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: risk-state-collector
        app.kubernetes.io/component: v2-risk-state
        app.kubernetes.io/part-of: trading-platform
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: ghcr.io/strat-relay/trading-platform-runtime@sha256:fe379924ca960b20709b00def97fe83c83541c107248ab08b97d85084ca14b18
          imagePullPolicy: IfNotPresent
          command: [python, -m, execution_v2.risk_state.collector_service]
          envFrom:
            - secretRef:
                name: trading-runtime-endpoints
          env:
            - {name: V2_EXECUTION_ACCOUNT_ID, value: "188428665"}
            - {name: V2_EXECUTION_BRIDGE_MODE, value: "real"}
            - {name: V2_BROKER_SYMBOL_MAP_JSON, value: '{"real:188428665":{"XAUUSD":"XAUUSDm","BTCUSD":"BTCUSDm","EURUSD":"EURUSDm","USDJPY":"USDJPYm"}}'}
            - {name: V2_READ_BRIDGE_URL, value: "http://10.10.10.100:22347/mcp"}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-redis-auth
                  key: password
            - {name: RISK_REDIS_URL, value: "redis://:$(REDIS_PASSWORD)@trading-redis.trading.svc:6379/0"}
            - {name: RISK_FAST_REFRESH_SECONDS, value: "10"}
            - {name: RISK_HISTORY_REFRESH_SECONDS, value: "30"}
            - {name: RISK_REFERENCE_REFRESH_SECONDS, value: "300"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
