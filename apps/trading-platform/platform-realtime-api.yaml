apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-realtime-api
  namespace: trading
  labels:
    app.kubernetes.io/name: platform-realtime-api
    app.kubernetes.io/part-of: trading-platform
    app.kubernetes.io/component: platform-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-realtime-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-realtime-api
        app.kubernetes.io/part-of: trading-platform
        app.kubernetes.io/component: platform-api
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: realtime
          image: ghcr.io/strat-relay/trading-platform-realtime-api@sha256:80485127082671fd41fee2e830633b74546a6fbb4e7a02dd99d2651455c64114
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 22352
              protocol: TCP
          envFrom:
            - secretRef:
                name: trading-runtime-endpoints
          env:
            - name: PLATFORM_API_CORS_ORIGINS
              value: "https://console.stratrelay.app"
            - name: PLATFORM_REALTIME_PORT
              value: "22352"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: platform-realtime-api
  namespace: trading
  labels:
    app.kubernetes.io/name: platform-realtime-api
    app.kubernetes.io/part-of: trading-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: platform-realtime-api
  ports:
    - name: http
      port: 22352
      targetPort: http
      protocol: TCP
