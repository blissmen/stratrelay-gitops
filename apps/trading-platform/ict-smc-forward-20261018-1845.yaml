apiVersion: v1
kind: ConfigMap
metadata:
  name: ict-smc-forward-20261019-0226-manifest
  namespace: trading
immutable: true
data:
  run.json: |
    {
      "schema": "library-forward-observation.v1",
      "execution_eligible": false,
      "run_id": "ict-smc-forward-20261019-0226",
      "activation_time": 1792377096,
      "keys": ["judas_swing@V2", "power_of_three@V1", "order_block_retracement@V2"],
      "symbols": {"XAUUSD": "XAUUSDm", "BTCUSD": "BTCUSDm", "USDJPY": "USDJPYm"},
      "history": 320,
      "max_age_seconds": 330,
      "prospective_max_delay": 120,
      "max_retained_bars": 10000,
      "entry_mode": "CONTEMPORANEOUS_CANDLE_OPEN"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ict-smc-forward-v1-observer
  namespace: trading
  labels:
    app.kubernetes.io/name: ict-smc-forward-v1-observer
    app.kubernetes.io/component: research-observer
    stratrelay.app/status: research
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: ict-smc-forward-v1-observer}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ict-smc-forward-v1-observer
        app.kubernetes.io/component: research-observer
        stratrelay.app/status: research
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: ghcr-pull}]
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: observer
          image: "ghcr.io/strat-relay/trading-platform-runtime@sha256:e94661478c91cb03766b131d8938100f8dd7fa872232983768c72a07031462ac"
          command: [python, -m, research.strategy_library_forward, run, --manifest, /config/run.json, --interval, "10"]
          envFrom: [{secretRef: {name: strategy-library-observer-db}}]
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: trading-redis-auth, key: password}}
            - {name: MARKET_DATA_REDIS_URL, value: "redis://:$(REDIS_PASSWORD)@trading-redis.trading.svc:6379/0"}
            - {name: PGCONNECT_TIMEOUT, value: "10"}
            - {name: EXECUTION_AUTHORITY_MODE, value: DISABLED}
            - {name: SIGNAL_AUTHORITY_MODE, value: RESEARCH_ONLY}
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: 1000m, memory: 768Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: manifest, mountPath: /config, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          readinessProbe:
            exec: {command: [python, -m, research.strategy_library_forward, health, --manifest, /config/run.json]}
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          startupProbe:
            exec:
              command: [python, -c, "import time; from postgres.db import connect; from research.strategy_library_forward import RunConfig; c=RunConfig.load('/config/run.json'); conn=connect(); cur=conn.cursor(); cur.execute(\"SELECT (state->'health'->>'observed_at')::double precision FROM research.strategy_library_forward_state WHERE run_id=%s\",(c.run_id,)); r=cur.fetchone(); conn.rollback(); conn.close(); raise SystemExit(0 if r and 0<=time.time()-r[0]<=900 else 1)"]
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 40
          livenessProbe:
            exec:
              command: [python, -c, "import time; from postgres.db import connect; from research.strategy_library_forward import RunConfig; c=RunConfig.load('/config/run.json'); conn=connect(); cur=conn.cursor(); cur.execute(\"SELECT (state->'health'->>'observed_at')::double precision FROM research.strategy_library_forward_state WHERE run_id=%s\",(c.run_id,)); r=cur.fetchone(); conn.rollback(); conn.close(); raise SystemExit(0 if r and 0<=time.time()-r[0]<=900 else 1)"]
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
      volumes:
        - {name: manifest, configMap: {name: ict-smc-forward-20261019-0226-manifest}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ict-smc-forward-v1-observer-egress
  namespace: trading
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: ict-smc-forward-v1-observer}}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: trading}}, podSelector: {matchLabels: {app.kubernetes.io/name: trading-postgres}}}]
      ports: [{port: 5432, protocol: TCP}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: trading}}, podSelector: {matchLabels: {app.kubernetes.io/name: trading-redis}}}]
      ports: [{port: 6379, protocol: TCP}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ict-smc-forward-v1-observer-postgres-ingress
  namespace: trading
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: trading-postgres}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: ict-smc-forward-v1-observer}}}]
      ports: [{port: 5432, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ict-smc-forward-v1-observer-redis-ingress
  namespace: trading
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: trading-redis}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: ict-smc-forward-v1-observer}}}]
      ports: [{port: 6379, protocol: TCP}]
