apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trading-platform-runtimes-egress
  namespace: trading
  labels:
    app.kubernetes.io/part-of: trading-platform
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [trade-management-runtime, signal-outbox-relay]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trading
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [trading-postgres, trading-nats]
      ports:
        - {port: 5432, protocol: TCP}
        - {port: 4222, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - ipBlock:
            cidr: 192.168.1.166/32
      ports:
        - {port: 22347, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trading-platform-runtimes-data-ingress
  namespace: trading
  labels:
    app.kubernetes.io/part-of: trading-platform
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [trading-postgres, trading-nats]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [trade-management-runtime, signal-outbox-relay]
      ports:
        - {port: 5432, protocol: TCP}
        - {port: 4222, protocol: TCP}
