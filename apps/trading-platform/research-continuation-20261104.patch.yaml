apiVersion: apps/v1
kind: Deployment
metadata:
  name: strategy-library-canary-v1-observer
  namespace: trading
spec:
  template:
    spec:
      initContainers:
      - name: verify-continuation-binding
        image: ghcr.io/strat-relay/trading-platform-runtime@sha256:12485d51200ad3e719e8b6cb5c70c520d71ec4f871ae8098d307a57d3418199d
        command: [python, /recovery/continuation_binding_preflight.py]
        volumeMounts:
        - name: binding-preflight
          mountPath: /recovery
          readOnly: true
      containers:
      - name: observer
        image: ghcr.io/strat-relay/trading-platform-runtime@sha256:12485d51200ad3e719e8b6cb5c70c520d71ec4f871ae8098d307a57d3418199d
      volumes:
      - name: manifest
        configMap: {name: library-canary-20261104-r4-manifest}
      - name: binding-preflight
        configMap: {name: continuation-binding-preflight-20261104-r3}
---
