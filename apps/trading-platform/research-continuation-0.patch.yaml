apiVersion: apps/v1
kind: Deployment
metadata:
  name: strategy-library-canary-v1-observer
  namespace: trading
spec:
  template:
    spec:
      containers:
      - name: observer
        image: "ghcr.io/strat-relay/trading-platform-reader-compat@sha256:96311b2883dd121b2175c71965bce8d9d1df2e35469f59d1bed0810cb58a6bdf"
      volumes:
      - name: manifest
        configMap:
          name: library-canary-20261031-r1-manifest
      - name: binding-preflight
        configMap:
          name: continuation-binding-preflight-20261031-r2
      initContainers:
      - name: verify-continuation-binding
        image: "ghcr.io/strat-relay/trading-platform-reader-compat@sha256:96311b2883dd121b2175c71965bce8d9d1df2e35469f59d1bed0810cb58a6bdf"
        command:
        - python
        - /recovery/continuation_binding_preflight.py
        envFrom:
        - secretRef:
            name: strategy-library-observer-db
        env:
        - name: PYTHONPATH
          value: /app
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: PGOPTIONS
          value: -c default_transaction_read_only=on -c statement_timeout=10000
        - name: PGCONNECT_TIMEOUT
          value: '10'
        - name: EXECUTION_AUTHORITY_MODE
          value: DISABLED
        volumeMounts:
        - name: manifest
          mountPath: /config
          readOnly: true
        - name: binding-preflight
          mountPath: /recovery
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi

# stratrelay-release: frozen
# Resume only after read-only saved-binding verification.
