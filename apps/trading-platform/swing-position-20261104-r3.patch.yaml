apiVersion: apps/v1
kind: Deployment
metadata:
  name: swing-position-v1-observer
  namespace: trading
spec:
  template:
    spec:
      initContainers:
        - name: verify-research-registration
          image: ghcr.io/strat-relay/trading-platform-runtime@sha256:12485d51200ad3e719e8b6cb5c70c520d71ec4f871ae8098d307a57d3418199d
          command: [python, -m, research.swing_position_forward, verify, --manifest, /config/run.json]
          envFrom:
            - secretRef:
                name: library-event-observer
            - secretRef:
                name: strategy-library-observer-db
          volumeMounts:
            - name: binding-preflight
              mountPath: /recovery
              readOnly: true
      containers:
        - name: observer
          image: ghcr.io/strat-relay/trading-platform-runtime@sha256:12485d51200ad3e719e8b6cb5c70c520d71ec4f871ae8098d307a57d3418199d
      volumes:
        - name: manifest
          configMap:
            name: swing-position-20261104-r5-manifest
        - name: binding-preflight
          configMap:
            name: continuation-binding-preflight-20261104-r3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swing-position-v1-orchestrator
  namespace: trading
spec:
  template:
    spec:
      initContainers:
        - name: verify-research-registration
          image: ghcr.io/strat-relay/trading-platform-runtime@sha256:12485d51200ad3e719e8b6cb5c70c520d71ec4f871ae8098d307a57d3418199d
          command: [python, -m, research.swing_position_forward, verify, --manifest, /config/run.json]
          envFrom:
            - secretRef:
                name: library-event-orchestrator
            - secretRef:
                name: strategy-library-observer-db
          volumeMounts:
            - name: binding-preflight
              mountPath: /recovery
              readOnly: true
      containers:
        - name: orchestrator
          image: ghcr.io/strat-relay/trading-platform-runtime@sha256:12485d51200ad3e719e8b6cb5c70c520d71ec4f871ae8098d307a57d3418199d
      volumes:
        - name: manifest
          configMap:
            name: swing-position-20261104-r5-manifest
        - name: binding-preflight
          configMap:
            name: continuation-binding-preflight-20261104-r3
