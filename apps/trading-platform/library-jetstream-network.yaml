apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: library-events-trading-postgres-ingress
  namespace: trading
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trading-postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          stratrelay.app/library-events: 'true'
    ports:
    - port: 5432
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: library-events-trading-nats-ingress
  namespace: trading
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trading-nats
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          stratrelay.app/library-events: 'true'
    ports:
    - port: 4222
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: library-events-egress
  namespace: trading
spec:
  podSelector:
    matchLabels:
      stratrelay.app/library-events: 'true'
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: trading-postgres
    ports:
    - port: 5432
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: trading-nats
    ports:
    - port: 4222
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: library-event-activate-apiserver
  namespace: trading
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: library-event-activate
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 10.43.0.1/32
    ports:
    - port: 443
      protocol: TCP
