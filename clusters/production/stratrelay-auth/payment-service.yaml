apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: stratrelay
    app.kubernetes.io/component: billing
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-service
        app.kubernetes.io/part-of: stratrelay
        app.kubernetes.io/component: billing
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: payment-service
          image: ghcr.io/strat-relay/payment-service@sha256:5dfd420ba6dcef8212ed06b4967aa52ec290f06dbaf2c1e9805e2f68587734b5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: stratrelay-auth-secrets
                  key: payment-database-url
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: stratrelay-auth-secrets
                  key: payment-db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stratrelay-auth-secrets
                  key: payment-db-password
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: stratrelay-auth-secrets
                  key: nats-url
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: payment-service-secrets
                  key: stripe-secret-key
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: payment-service-secrets
                  key: stripe-webhook-secret
            - name: STRATRELAY_APP_URL
              value: https://stratrelay.app
            - name: CLIENT_SERVICE_BASE_URL
              value: http://client-service.trading.svc.cluster.local:8080
            # CommercialCatalogClient reads authoritative prices and active
            # symbols/tiers through the internal Platform API router.
            - name: PLATFORM_API_URL
              value: http://platform-api-router.trading.svc.cluster.local:22351
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stratrelay-auth-secrets
                  key: internal-api-key
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: stratrelay
    app.kubernetes.io/component: billing
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: payment-service
  ports:
    - name: http
      port: 8080
      targetPort: http
